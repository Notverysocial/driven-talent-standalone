name: ci

# REQUIRED gate. Everything here is deterministic and needs no database, so a
# red result always means something is genuinely broken.
#
# Two things run:
#   1. Build      — compiles the app. This is the step that caught the real
#                   main-breaking duplicate-identifier regression on 2026-07-19.
#   2. logic e2e  — the pure-function specs in e2e/logic (no browser, no server).
#
# The browser specs in e2e/browser are NOT run here. They are preserved intact
# and run by the separate, non-required `e2e-browser` workflow. Reason: CI has no
# database, so Supabase-backed pages spend ~28s in retry/backoff against the
# placeholder host and those tests cannot get a fair verdict. Full explanation in
# playwright.config.ts; the fix is docs/CI-REAL-BACKEND-FOLLOWUP.md.
# Do not merge the browser specs back into this job until CI has a real backend.

on:
  pull_request:
  push:
    branches:
      - main
      - feat/v2-integration

jobs:
  required:
    name: build + logic tests (required)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The logic specs never open a page, but installing chromium is cheap
      # insurance against the required gate going red for a tooling reason.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          # Placeholders only affect runtime reads, not compilation. No test in
          # this job talks to a server or a database.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

      - name: Run logic tests (pure functions, no server)
        run: npx playwright test --project=logic

      - name: Note where the browser specs went
        if: always()
        run: |
          echo "Browser/data specs (e2e/browser) are intentionally NOT in this required gate."
          echo "They run in the non-required 'e2e-browser' workflow (manual dispatch)."
          echo "Reason: no database in CI -> ~28s renders against placeholder Supabase."
          echo "See playwright.config.ts and docs/CI-REAL-BACKEND-FOLLOWUP.md."

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-logic
          path: playwright-report
          retention-days: 14
